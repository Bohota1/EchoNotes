<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="EchoNotes - a spoken notebook for blind and low-vision students."
    />
    <meta name="theme-color" content="#f4f6fa" />
    <title>EchoNotes</title>
    <!--
      Atkinson Hyperlegible Next and Mono, from the Braille Institute: drawn so
      that easily confused characters (I l 1, O 0, rn m) stay distinct for
      low-vision readers. The system font takes over if these cannot load.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Mono:wght@500;700&family=Atkinson+Hyperlegible+Next:wght@400;600;800&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
