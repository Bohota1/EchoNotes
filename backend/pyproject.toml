[project]
name = "echonotes-backend"
version = "0.1.0"
description = "EchoNotes backend: LNT pipeline (Saini et al. 2023) + Idea11y hierarchical outline (Li et al. 2026)"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
