[project]
name = "echonotes-backend"
version = "0.1.0"
description = "EchoNotes backend: LNT pipeline (Saini et al. 2023) + Idea11y hierarchical outline (Li et al. 2026)"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
    # FastAPI's dependency injection is `arg: T = Depends(...)` by design.
    "B008",
    # Several regexes are assembled with %-formatting from alternation lists,
    # where an f-string would nest braces inside regex braces.
    "UP031",
    # `class X(str, Enum)` is kept over StrEnum: it is what Pydantic and
    # SQLAlchemy examples use, and the values are compared against DB strings.
    "UP042",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "slow: exercises the real Whisper model; deselect with -m 'not slow'",
]
